author: blocks. As a result the daily changelog compile produced no entries and 
  the in-game changelog popup body has been empty since the rename. This adds a 
  single AutoChangeLog-style YAML covering the four user-visible buckets.
delete-after: true
changes:
  - bugfix: Airlocks, computers, vending machines, alarms, and other machines no
      longer instantly break and electrify themselves after a single melee hit.
  - rscadd: Server is now ReduxStation. Player-visible strings flipped from 
      ResurgenceStation / Nova HippieStation / HippieStation to ReduxStation. 
      Internal upstream attribution (folder names, map identifier) preserved.
  - server: Site moved from owo.fm to reduxstation.com. TGS panel at 
      tgs.reduxstation.com; statbus at stats.reduxstation.com; logs at 
      logs.reduxstation.com; webmap at map.reduxstation.com.
  - tgs: Enabled the bundled tgstation-server web control panel at /app/.
