name: Build native libs

# Native libraries (rust_g) are committed binaries in the repo root. They get
# used by:
#   - .github/workflows/test.yml (Compile and Run Tests) — `cp $GAME_DIR/rust_g
#     $BYOND_BIN/rust_g`.
#   - tools/deploy.sh during TGS auto-deploy — `cp rust_g* $1/`, which lands
#     them in $GAME_DIR; PostCompile.sh then scatters them to every BYOND
#     lookup path.
#   - The production Docker image Stage 5, which actually copies its own
#     fresh-built rust_g.so over the committed one before runtime.
#
# Before this workflow, the committed rust_g binary was the one placed during
# initial fork import (built with `--features="log"`, no dmi). The Dockerfile's
# rust_g_builder stage was updated by PR #61 to build with `--features="log
# dmi"`, but nothing rebuilt the committed binary, so:
#   - CI tests called rustg_dmi_strip_metadata against the dmi-less .so and
#     emitted "undefined symbol" runtime errors that failed Compile and Run
#     Tests.
#   - TGS auto-deploy scattered the same dmi-less .so to production, breaking
#     every spritesheet UI.
#
# This workflow closes the gap: build rust_g via the same Dockerfile stage the
# production runtime image uses, compare against what's currently in the repo,
# and auto-commit the fresh binary if it differs. CI tests and TGS deploy both
# pick up the fresh binary automatically. Future Dockerfile changes propagate
# without anyone running docker compose build by hand.

on:
  push:
    branches:
      - master
      # Also fire on feature/fix branches so the auto-commit can land on the
      # PR itself before merge — otherwise the first run after merging a
      # Dockerfile change has CI test failures while master self-heals.
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-native-libs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize so two concurrent runs do not race on the auto-commit push.
  group: build-native-libs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build rust_g, auto-commit if changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We push back on a diff. Need the branch's actual head, not the
          # merge ref, and an auth token with contents:write.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Build rust_g from Dockerfile rust_g_builder stage
        run: |
          set -euo pipefail
          # Same stage the production Docker runtime image consumes.
          docker build --target rust_g_builder -t rust-g-builder:ci .
          docker create --name rg-extract rust-g-builder:ci
          docker cp rg-extract:/librust_g.so ./rust_g.fresh
          docker rm rg-extract

          # Hard gate: must be 32-bit (BYOND is 32-bit; a 64-bit .so will be
          # silently ignored at runtime and break call_ext).
          file rust_g.fresh | grep -q "32-bit" \
            || { echo "::error::rust_g.fresh is not 32-bit, BYOND will refuse to load it"; file rust_g.fresh; exit 1; }

          # Hard gate: must export dmi_strip_metadata. This is the symbol
          # that the asset_cache pipeline needs; if cargo dropped the dmi
          # feature again (or if image extraction picked up a wrong
          # binary), we want to fail loudly here rather than commit a
          # silently-broken binary.
          if ! nm -D --defined-only rust_g.fresh 2>/dev/null | grep -qw dmi_strip_metadata \
             && ! strings rust_g.fresh | grep -qw dmi_strip_metadata; then
            echo "::error::dmi_strip_metadata symbol missing from rust_g.fresh — cargo build dropped the dmi feature"
            exit 1
          fi

          echo "rust_g.fresh OK: $(stat -c %s rust_g.fresh) bytes, sha256 $(sha256sum rust_g.fresh | cut -d' ' -f1)"

      - name: Compare with committed binary
        id: cmp
        run: |
          if [ ! -f rust_g ]; then
            echo "no committed rust_g, treating as differs"
            echo "differs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if cmp -s rust_g rust_g.fresh; then
            echo "committed rust_g matches fresh build, no commit needed"
            echo "differs=false" >> "$GITHUB_OUTPUT"
          else
            echo "committed rust_g differs from fresh build"
            echo "  committed: $(sha256sum rust_g | cut -d' ' -f1)"
            echo "  fresh:     $(sha256sum rust_g.fresh | cut -d' ' -f1)"
            echo "differs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace committed binary and push
        if: steps.cmp.outputs.differs == 'true'
        run: |
          set -euo pipefail
          mv rust_g.fresh rust_g
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Defence in depth: if any stale variant filename slipped in (the
          # previous draft of PR #80 renamed to `librust_g.so` for a bit),
          # remove it before adding the canonical `rust_g`.
          git rm librust_g.so 2>/dev/null || true
          git add rust_g
          # [ci skip] prevents the auto-commit from triggering another run of
          # this workflow. CI tests still run on the new commit because they
          # do not honor [ci skip].
          git commit -m "Automatic rust_g rebuild from Dockerfile rust_g_builder stage [ci skip]"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Build native libs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.cmp.outputs.differs }}" = "true" ]; then
            echo "Committed \`rust_g\` was stale; replaced with fresh build and pushed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Committed \`rust_g\` already matches the fresh build." >> "$GITHUB_STEP_SUMMARY"
          fi
