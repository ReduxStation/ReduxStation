name: TGS auto-deploy

# When master moves (a PR was merged), tell the live tgstation-server to pull
# the new HEAD and start a deployment job. Caddy hot-swaps the watchdog when
# the compile succeeds; the running round is unaffected, the next round runs
# the new code.
#
# This is the webhook side of the deploy story. PRs that have NOT been merged
# stay testable via TGS's "Test Merge" feature on the panel.
#
# Required repository secrets:
#   TGS_URL           -- public HTTPS base, e.g. https://tgs.reduxstation.com
#   TGS_USERNAME      -- TGS user with InstanceManager + DreamMaker rights
#   TGS_PASSWORD      -- password for that user
#   TGS_INSTANCE_ID   -- numeric instance id (visible in the panel URL)
#
# The user that owns the credentials must have at minimum:
#   - RepositoryRights.UpdateBranch (to run "update from origin")
#   - DreamMakerRights.Compile      (the auto-deploy that follows the update
#                                    inherits the user that triggered it)
#
# If the API call fails (TGS down, creds rotated, network issue) the workflow
# fails loudly so we notice. The deploy itself is async on the TGS side; we
# do not block on the compile finishing.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgs-auto-deploy
  cancel-in-progress: false

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger TGS repository update + deploy
        env:
          TGS_URL: ${{ secrets.TGS_URL }}
          TGS_USERNAME: ${{ secrets.TGS_USERNAME }}
          TGS_PASSWORD: ${{ secrets.TGS_PASSWORD }}
          TGS_INSTANCE_ID: ${{ secrets.TGS_INSTANCE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TGS_URL:-}" ] || [ -z "${TGS_USERNAME:-}" ] \
             || [ -z "${TGS_PASSWORD:-}" ] || [ -z "${TGS_INSTANCE_ID:-}" ]; then
            # Secrets not configured yet. Skip cleanly so master CI does
            # not stay red on every push. A maintainer populates the four
            # secrets in repository settings; subsequent pushes then
            # actually trigger the deploy.
            echo "::notice::Skipping auto-deploy: one or more required secrets are unset (TGS_URL, TGS_USERNAME, TGS_PASSWORD, TGS_INSTANCE_ID). Configure them in repository settings to enable."
            exit 0
          fi

          # TGS requires an Api header naming the client API version. Pick a
          # 10.x line; the server negotiates compat. Bump if TGS rejects it.
          API_HEADER="Tgstation.Server.Api/10.10.0"
          UA_HEADER="ReduxStation-AutoDeploy/1.0"

          # Strip any trailing slash on TGS_URL so we can append paths cleanly.
          BASE="${TGS_URL%/}"

          # Helper: run curl, capture body+code, fail the step with a clearly
          # labelled error showing the HTTP status and response body so the
          # log identifies which call failed and why (instead of just
          # `curl: (22) error: NNN`).
          tgs_call() {
            local label="$1"
            local method="$2"
            local url="$3"
            local body_file
            body_file=$(mktemp)
            local code
            shift 3
            code=$(curl -sS -o "$body_file" -w "%{http_code}" -X "$method" "$url" "$@" 2>&1) || true
            # Diagnostics to stderr so $(tgs_call ...) only captures the body.
            {
              echo "----- $label -----"
              echo "$method $url -> HTTP $code"
              echo "Response body:"
              if jq -e . <"$body_file" >/dev/null 2>&1; then
                jq '.' <"$body_file"
              else
                cat "$body_file"
              fi
              echo "-------------------"
            } >&2
            if [ "${code:0:1}" != "2" ]; then
              rm -f "$body_file"
              return 1
            fi
            cat "$body_file"
            rm -f "$body_file"
          }

          # Step 1: log in. POST /api/ with Basic auth returns a Bearer token
          # in the response body's `bearer` field.
          BASIC=$(printf '%s:%s' "$TGS_USERNAME" "$TGS_PASSWORD" | base64 -w0)
          if ! LOGIN_RESP=$(tgs_call "LOGIN" POST "$BASE/api/" \
              -H "Accept: application/json" \
              -H "Api: $API_HEADER" \
              -H "User-Agent: $UA_HEADER" \
              -H "Authorization: Basic $BASIC"); then
            echo "::error::Login failed. Check TGS_USERNAME / TGS_PASSWORD and that the user is enabled."
            exit 1
          fi

          TOKEN=$(printf '%s' "$LOGIN_RESP" | jq -r '.bearer // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Login response did not include a bearer token."
            exit 1
          fi
          echo "Login OK. Token length: ${#TOKEN}"

          # Step 1.5: dump the authenticated user's identity and permission
          # set so 403s downstream become diagnosable. GET /api/User reads the
          # current user (no instance header). GET /api/InstancePermissionSet
          # with the Instance header reads the per-instance permission set
          # for that user, which is the one that matters for repo / deploy
          # operations. Both are best-effort: if they fail we keep going.
          tgs_call "WHOAMI" GET "$BASE/api/User" \
            -H "Accept: application/json" \
            -H "Api: $API_HEADER" \
            -H "User-Agent: $UA_HEADER" \
            -H "Authorization: Bearer $TOKEN" >/dev/null || true

          tgs_call "INSTANCE PERMISSION SET" GET "$BASE/api/InstancePermissionSet" \
            -H "Accept: application/json" \
            -H "Api: $API_HEADER" \
            -H "User-Agent: $UA_HEADER" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Instance: $TGS_INSTANCE_ID" >/dev/null || true

          # Helper: poll a TGS job ID until it completes, fail the step loudly
          # if the job ended with an exception. Without this the workflow
          # only verifies the API call returned 2xx ("job accepted"); it does
          # NOT verify the job itself succeeded. That gap silently masked 10+
          # broken auto-deploys in a row when a stale testmerge conflicted
          # with origin/master and every Repository update job died with
          # `JobException: A merge conflict occurred`.
          wait_for_job() {
            local label="$1"
            local job_id="$2"
            local timeout_seconds="${3:-600}"
            if [ -z "$job_id" ] || [ "$job_id" = "null" ]; then
              echo "::warning::$label: no job id returned by API - skipping wait"
              return 0
            fi
            local deadline=$(( $(date +%s) + timeout_seconds ))
            echo "Polling $label job $job_id (timeout ${timeout_seconds}s)..."
            while true; do
              local body status now
              now=$(date +%s)
              if [ $now -gt $deadline ]; then
                echo "::error::$label job $job_id did not complete within ${timeout_seconds}s. Likely TGS-side hang; check panel."
                return 1
              fi
              body=$(tgs_call "$label POLL" GET "$BASE/api/Job/$job_id" \
                -H "Accept: application/json" \
                -H "Api: $API_HEADER" \
                -H "User-Agent: $UA_HEADER" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Instance: $TGS_INSTANCE_ID" 2>/dev/null) || return 1
              local stopped_at exception_details error_code cancelled
              stopped_at=$(printf '%s' "$body" | jq -r '.stoppedAt // empty')
              if [ -z "$stopped_at" ]; then
                sleep 5
                continue
              fi
              exception_details=$(printf '%s' "$body" | jq -r '.exceptionDetails // empty')
              error_code=$(printf '%s' "$body" | jq -r '.errorCode // empty')
              cancelled=$(printf '%s' "$body" | jq -r '.cancelled // false')
              if [ -n "$exception_details" ] || [ -n "$error_code" ] || [ "$cancelled" = "true" ]; then
                echo "::error::$label job $job_id ended in failure."
                echo "  errorCode: ${error_code:-<none>}"
                echo "  cancelled: $cancelled"
                echo "  exceptionDetails (first 2000 chars):"
                printf '%s' "$exception_details" | head -c 2000
                echo
                return 1
              fi
              echo "$label job $job_id completed successfully."
              return 0
            done
          }

          # Step 2: tell the instance to pull the new master. POST /api/Repository
          # with updateFromOrigin: true is the API equivalent of clicking
          # "Reset repository to remote tracked reference" on the panel.
          # (PATCH is the Reclone endpoint - completely different operation
          # with its own RepositoryRights.Reclone permission. Don't mix them up.)
          # 403 here = user lacks Repository.UpdateBranch on the instance.
          if ! UPDATE_RESP=$(tgs_call "REPOSITORY UPDATE" POST "$BASE/api/Repository" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Api: $API_HEADER" \
              -H "User-Agent: $UA_HEADER" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Instance: $TGS_INSTANCE_ID" \
              -d '{"updateFromOrigin": true}'); then
            echo "::error::Repository update failed. If HTTP 403 above, the deploy user is missing Repository -> Update Branch on instance $TGS_INSTANCE_ID. If HTTP 409, another job is already in flight."
            exit 1
          fi
          JOB_ID=$(printf '%s' "$UPDATE_RESP" | jq -r '.activeJob.id // empty')
          echo "Repo update queued. Job id: ${JOB_ID:-<none returned>}"

          # Wait for the repo-update job to actually complete. Failure here
          # is usually a merge conflict between origin/master and an active
          # testmerge — fail the workflow before we attempt to compile against
          # the unchanged state.
          if ! wait_for_job "REPOSITORY UPDATE" "$JOB_ID" 120; then
            echo "::error::Repository update job failed. The compile step will not run. Check the TGS panel: a stale testmerge entry, an active job collision, or auth scope is the usual cause."
            exit 1
          fi

          # Step 3: trigger a deployment explicitly. Doing this as its own call
          # removes the dependency on the instance's "Compile & Deploy after
          # changes" toggle being set in the panel - the workflow always queues
          # a compile after the repo update, regardless of panel state.
          # PUT /api/DreamMaker starts a new compile job.
          # 403 here = user lacks DreamMaker.Compile (Create Deployment) on the instance.
          if ! DEPLOY_RESP=$(tgs_call "DEPLOY" PUT "$BASE/api/DreamMaker" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Api: $API_HEADER" \
              -H "User-Agent: $UA_HEADER" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Instance: $TGS_INSTANCE_ID" \
              -d '{}'); then
            echo "::error::Deploy request failed. If HTTP 403 above, the deploy user is missing Deployment -> Create Deployment on instance $TGS_INSTANCE_ID."
            exit 1
          fi
          DEPLOY_JOB=$(printf '%s' "$DEPLOY_RESP" | jq -r '.id // empty')
          echo "Deploy queued. Job id: ${DEPLOY_JOB:-<none returned>}"

          # Wait for the compile to actually finish. Failure here is typically
          # a DM syntax error introduced by the merge that produced this push,
          # or a regression in a generated artifact (rust_g binary, tgui
          # bundle). The exceptionDetails from TGS contains the exact compiler
          # error, which we surface so the GitHub Actions failure summary
          # tells you what to fix without having to dig through TGS logs.
          if ! wait_for_job "DEPLOY" "$DEPLOY_JOB" 600; then
            echo "::error::DreamMaker compile job failed. Check the exceptionDetails above for the exact compiler error."
            exit 1
          fi
          echo "Auto-deploy succeeded. Master now compiled and queued for the next round restart."
