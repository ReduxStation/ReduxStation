name: Compile and Run Tests

on:
  push:
    branches-ignore:
      - '___TGS3TempBranch'
      - '___TGSTempBranch'
      - '___TGSUpdateBranch'
  pull_request:
    branches-ignore:
      - '___TGS3TempBranch'
      - '___TGSTempBranch'
      - '___TGSUpdateBranch'

jobs:
  test:
    name: Compile and Run Tests
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim
    defaults:
      run:
        shell: bash

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: tg_travis
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Install system packages
        run: |
          dpkg --add-architecture i386
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip make git default-mysql-client \
            libc6:i386 libstdc++6:i386 libgcc-s1:i386 \
            libmariadb3:i386 libssl3:i386 libcurl4:i386 zlib1g:i386

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache BYOND
        id: cache-byond
        uses: actions/cache@v4
        with:
          path: ~/BYOND
          key: debian12-byond-v2-${{ hashFiles('dependencies.sh') }}

      - name: Install BYOND
        if: steps.cache-byond.outputs.cache-hit != 'true'
        run: tools/travis/install_byond.sh

      - name: Configure BYOND environment
        run: |
          source ~/BYOND/byond/bin/byondsetup
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Create test databases
        run: |
          mysql -u root -h mariadb -e 'CREATE DATABASE tg_travis_prefixed;'
          mysql -u root -h mariadb tg_travis < SQL/tgstation_schema.sql
          mysql -u root -h mariadb tg_travis_prefixed < SQL/tgstation_schema_prefixed.sql

      - name: Compile game
        run: bash tools/travis/dm.sh -DTRAVISBUILDING hippiestation.dme

      - name: Run server tests
        # Services are reachable by hostname inside a container job, not 127.0.0.1
        run: |
          sed -i 's/ADDRESS 127.0.0.1/ADDRESS mariadb/' tools/travis/travis_config.txt
          bash tools/travis/run_server.sh
