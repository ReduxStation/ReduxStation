name: Compile and Run Tests

on:
  push:
    branches-ignore:
      - '___TGS3TempBranch'
      - '___TGSTempBranch'
      - '___TGSUpdateBranch'
  pull_request:
    branches-ignore:
      - '___TGS3TempBranch'
      - '___TGSTempBranch'
      - '___TGSUpdateBranch'

jobs:
  test:
    name: Compile and Run Tests
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim
    defaults:
      run:
        shell: bash

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: tg_travis
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Install system packages
        run: |
          dpkg --add-architecture i386
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip make git default-mysql-client \
            libc6:i386 libstdc++6:i386 libgcc-s1:i386 \
            libmariadb3:i386 libsqlite3-0:i386 libssl3:i386 libcurl4:i386 zlib1g:i386

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache BYOND
        id: cache-byond
        uses: actions/cache@v4
        with:
          path: ~/BYOND
          key: debian12-byond-v2-${{ hashFiles('dependencies.sh') }}

      - name: Install BYOND
        if: steps.cache-byond.outputs.cache-hit != 'true'
        run: tools/travis/install_byond.sh

      - name: Configure BYOND environment
        run: |
          source ~/BYOND/byond/bin/byondsetup
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Scatter native binaries
        # Mirrors the runtime stage of the Dockerfile exactly.
        # rust_g, libBSQL.so, libquickwrite.so are committed to the repo root —
        # no downloads needed. Scatter them to every path dlopen("rust_g") etc.
        # might search: BYOND's own bin dir, standard lib paths, and the game dir.
        run: |
          BYOND_BIN="$HOME/BYOND/byond/bin"
          GAME_DIR="$GITHUB_WORKSPACE"

          # rust_g — dlopen("rust_g") searches LD_LIBRARY_PATH first
          cp "$GAME_DIR/rust_g" "$BYOND_BIN/rust_g"
          cp "$GAME_DIR/rust_g" "$BYOND_BIN/rust_g.so"
          cp "$GAME_DIR/rust_g" "$BYOND_BIN/librust_g.so"
          cp "$GAME_DIR/rust_g" "$GAME_DIR/rust_g.so"
          cp "$GAME_DIR/rust_g" "$GAME_DIR/librust_g.so"
          cp "$GAME_DIR/rust_g" /usr/lib/i386-linux-gnu/rust_g.so
          cp "$GAME_DIR/rust_g" /usr/lib/i386-linux-gnu/librust_g.so
          cp "$GAME_DIR/rust_g" /usr/local/lib/rust_g.so
          cp "$GAME_DIR/rust_g" /usr/local/lib/librust_g.so

          # libBSQL.so — all filename variants BYOND might try
          cp "$GAME_DIR/libBSQL.so" "$BYOND_BIN/libBSQL.so"
          cp "$GAME_DIR/libBSQL.so" "$BYOND_BIN/BSQL.so"
          cp "$GAME_DIR/libBSQL.so" "$BYOND_BIN/BSQL"
          cp "$GAME_DIR/libBSQL.so" "$GAME_DIR/BSQL.so"
          cp "$GAME_DIR/libBSQL.so" "$GAME_DIR/BSQL"
          cp "$GAME_DIR/libBSQL.so" /usr/lib/i386-linux-gnu/libBSQL.so
          cp "$GAME_DIR/libBSQL.so" /usr/local/lib/libBSQL.so

          # libquickwrite.so
          cp "$GAME_DIR/libquickwrite.so" "$BYOND_BIN/libquickwrite.so"
          cp "$GAME_DIR/libquickwrite.so" /usr/lib/i386-linux-gnu/libquickwrite.so
          cp "$GAME_DIR/libquickwrite.so" /usr/local/lib/libquickwrite.so

          # MariaDB .so.2 compat symlink — BSQL was linked against libmariadb.so.2
          # on older systems; Debian 12 only ships .so.3
          ln -sf /usr/lib/i386-linux-gnu/libmariadb.so.3 \
                 /usr/lib/i386-linux-gnu/libmariadb.so.2

          ldconfig

      - name: Create test databases
        run: |
          mysql -u root -h mariadb -e 'CREATE DATABASE tg_travis_prefixed;'
          mysql -u root -h mariadb tg_travis < SQL/tgstation_schema.sql
          mysql -u root -h mariadb tg_travis_prefixed < SQL/tgstation_schema_prefixed.sql

      - name: Compile game
        run: tools/travis/dm.sh -DTRAVISBUILDING hippiestation.dme

      - name: Run server tests
        # Services are reachable by hostname inside a container job, not 127.0.0.1
        run: |
          sed -i 's/ADDRESS 127.0.0.1/ADDRESS mariadb/' tools/travis/travis_config.txt
          tools/travis/run_server.sh
